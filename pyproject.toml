[project]
name = "code-assistant"
version = "0.1.0"
description = "RAG code assistant that answers questions about Ultralytics YOLO from its source code."
readme = "README.md"
authors = [{ name = "Daniel Poncelas", email = "danielponcelasvar@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.3",
    "sentence-transformers>=6.1.0",
    "typer>=0.27.3",
]

[project.scripts]
code-assistant = "code_assistant.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
# Exactly one PyTorch build is installed; see [tool.uv.sources].
cpu = ["torch>=2.14.1"]
cuda = ["torch>=2.14.1"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.0"
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "cuda" }]]

# PyTorch build selection:
# - default: CPU-only wheels on Linux/Windows (~200 MB instead of multi-GB CUDA wheels).
#   macOS uses the regular wheels, which already include Apple-GPU (MPS) acceleration.
# - `--no-group cpu --group cuda`: CUDA 12.6 wheels for NVIDIA GPUs (driver >= 525).
#   Only worth it to speed up `index`; answering questions is fast on CPU.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cuda", group = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear, UP: pyupgrade, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
