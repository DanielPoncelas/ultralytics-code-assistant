    "ultralytics/engine/tuner.py::Tuner.__call__",
    "ultralytics/engine/model.py::Model.tune",
]
key_facts = [
    "It is not a grid search: Tuner evolves hyperparameters by mutating the best previous results with Gaussian noise (evolutionary search).",
    "Mutations are clipped to a search space of (min, max) bounds for hyperparameters such as lr0, lrf, momentum and augmentation settings.",
    "Each iteration trains with the mutated hyperparameters and records its fitness; the best set is saved to best_hyperparameters.yaml.",
]
