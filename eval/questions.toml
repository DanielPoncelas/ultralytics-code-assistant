# Evaluation questions for the Ultralytics code assistant.
#
# Every question is grounded in a real user question from the Ultralytics GitHub issue
# tracker (`source`). Questions are paraphrased into a self-contained form.
#
# `relevant` lists the chunks that answer the question, as "<path>::<qualified name>".
# Labels were written by reading the indexed source (v8.4.175) BEFORE running any
# retrieval, so that they don't reflect any model's output. A question counts as a hit
# at rank k if ANY relevant symbol appears in the top k (deduplicated) results.
#
# `in_scope = false` marks questions whose answer lives outside the indexed folders
# (ultralytics/{models,engine,data}). They are excluded from retrieval metrics and used
# to check that the assistant says it cannot answer instead of guessing.
#
# `mentions_symbol` is true when the question names a function/class/argument, which
# makes lexical overlap easier. `example = true` marks the 5 questions shown in the README
# (chosen before generating any answer).

# --- Training -------------------------------------------------------------------------

[[question]]
id = "train-resume"
question = "My training run was interrupted at epoch 63. How do I resume it from the last checkpoint, and what state gets restored?"
category = "training"
source = "https://github.com/ultralytics/ultralytics/issues/17492"
mentions_symbol = false
example = true
relevant = [
    "ultralytics/engine/trainer.py::BaseTrainer.check_resume",
    "ultralytics/engine/trainer.py::BaseTrainer.resume_training",
]
key_facts = [
    "Resume with model.train(resume=True) (or resume='path/to/last.pt'), which reloads the run's last.pt checkpoint.",
    "check_resume restores the original training arguments from the checkpoint; only a small whitelist (e.g. imgsz, batch, device, workers) can be overridden.",
    "Training restarts at the saved epoch + 1, with the optimizer state, EMA weights and best fitness restored from the checkpoint.",
]
evidence = [
    "ultralytics/engine/model.py:877-886",
    "ultralytics/engine/trainer.py:1020-1065",
    "ultralytics/engine/trainer.py:1067-1082",
    "ultralytics/engine/trainer.py:1124-1141",
]

[[question]]
id = "train-optimizer-auto"
question = "Which optimizer is used when I set optimizer='auto', and how is its learning rate chosen?"
category = "training"
source = "https://github.com/ultralytics/ultralytics/issues/3360"
mentions_symbol = true
relevant = ["ultralytics/engine/trainer.py::BaseTrainer.build_optimizer"]
key_facts = [
    "With optimizer='auto' the user's lr0 is ignored and the optimizer and learning rate are chosen automatically.",
    "MuSGD (lr=0.01, momentum=0.9) is chosen when the planned training iterations exceed 10,000; otherwise AdamW.",
    "For AdamW the learning rate is lr_fit = round(0.002 * 5 / (4 + nc), 6), where nc is the number of classes.",
]
