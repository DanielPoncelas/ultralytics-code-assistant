    "lr0 is the initial learning rate and lrf the final learning rate as a fraction of lr0 (final lr = lr0 * lrf).",
    "The decay is linear by default, lf(x) = max(1 - x/epochs, 0) * (1 - lrf) + lrf; a cosine (one-cycle) schedule is used only with cos_lr=True.",
